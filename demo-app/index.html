<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Demo App · 通用性验证</title>
<style>
  :root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--dim:#6e6e73;--line:#e8e8ed;
        --accent:#0071e3;--fill:#f0f0f3}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);font-size:13px;height:100vh;display:flex;flex-direction:column}
  header{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;
         border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .tag{font-size:11.5px;color:var(--dim)}
  header .sp{flex:1}
  main{flex:1;display:flex;overflow:hidden}
  #left{flex:1;padding:18px;overflow:auto}
  #right{width:420px;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
  .row{display:flex;gap:8px;margin-bottom:14px}
  input[type=text],textarea{width:100%;padding:8px 11px;border:1px solid transparent;border-radius:9px;
        background:var(--fill);font:inherit;font-size:12.5px}
  input[type=text]:focus,textarea:focus{outline:none;background:#fff;border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(0,113,227,.12)}
  button{font:inherit;font-size:12.5px;padding:6px 14px;border-radius:980px;border:1px solid #d2d2d7;
         background:#fff;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;
        border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .item.done span{text-decoration:line-through;color:var(--dim)}
  .item span{flex:1}
  .item .k{font-size:10.5px;color:var(--dim)}
  #term{flex:1;background:#1c1c1e;color:#e8e8ed;font-family:ui-monospace,Menlo,monospace;
        font-size:11px;line-height:1.55;padding:12px;overflow:auto;white-space:pre-wrap}
  .bar{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.6;padding:8px 12px}
</style>
</head>
<body>
<header>
  <h1>Demo App</h1>
  <span class="tag">同一个 bridge，不同状态文件（state/notes.json）</span>
  <span class="sp"></span>
  <button id="btnDoc">让 DSH 写文档</button>
</header>
<main>
  <section id="left">
    <div class="row">
      <input type="text" id="inp" placeholder="加一条笔记，回车">
      <button class="primary" id="add">添加</button>
    </div>
    <div id="list"></div>
    <div class="hint" style="padding-left:0">
      这个页面和 DSH Atlas 共用 <code>bridge/serve.py</code>：
      <code>POST /state?name=notes</code> 存状态、
      <code>POST /dsh/ask</code> 跑 headless、
      <code>GET /docs</code> 列文档。
    </div>
  </section>
  <aside id="right">
    <div class="bar">
      <input type="text" id="task" placeholder="给 DSH 一条任务">
      <button class="primary" id="send">发送</button>
    </div>
    <div id="term">等待任务…</div>
  </aside>
</main>
<script>
const API = location.origin.startsWith("http") ? "" : "http://127.0.0.1:8777";
let STATE = {updated: "", items: []}, SID = null;

function render(){
  const box = document.getElementById("list");
  if(!STATE.items.length){ box.innerHTML = '<div class="hint">还没有笔记</div>'; return; }
  box.innerHTML = STATE.items.map((it, i) =>
    `<div class="item ${it.done ? "done" : ""}">
       <input type="checkbox" data-i="${i}" ${it.done ? "checked" : ""}>
       <span>${it.text}</span>
       <span class="k">${it.by || ""}</span>
       <button data-del="${i}" style="padding:2px 10px;font-size:11px">删</button>
     </div>`).join("");
  box.querySelectorAll("[data-i]").forEach(c => c.onchange = () => {
    STATE.items[+c.dataset.i].done = c.checked; save(); render();
  });
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    STATE.items.splice(+b.dataset.del, 1); save(); render();
  });
}

async function save(){
  STATE.updated = new Date().toISOString();
  await fetch(API + "/state?name=notes", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify(STATE)
  });
}

async function load(){
  try{
    const r = await fetch(API + "/state?name=notes", {cache:"no-store"});
    if(r.ok){ const j = await r.json(); if(j.updated !== STATE.updated){ STATE = j; render(); } }
  }catch(e){}
}

document.getElementById("add").onclick = () => {
  const el = document.getElementById("inp");
  if(!el.value.trim()) return;
  STATE.items.push({text: el.value.trim(), done: false, by: "human"});
  el.value = ""; save(); render();
};
document.getElementById("inp").addEventListener("keydown", e => {
  if(e.key === "Enter") document.getElementById("add").click();
});

async function ask(task){
  const term = document.getElementById("term");
  term.textContent += "\n❯ " + task + "\n";
  const resp = await fetch(API + "/dsh/ask", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({task, session_id: SID})
  });
  const reader = resp.body.getReader(); const dec = new TextDecoder();
  let buf = "";
  for(;;){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf("\n\n")) >= 0){
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      for(const line of block.split("\n")){
        if(!line.startsWith("data:")) continue;
        let ev; try{ ev = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
        if(ev.type === "session") SID = ev.sessionId;
        else if(ev.type === "text"){ term.textContent += ev.text; term.scrollTop = term.scrollHeight; }
        else if(ev.type === "error"){ term.textContent += "\n[error] " + ev.message; }
      }
    }
  }
  term.textContent += "\n";
  load();
}

document.getElementById("send").onclick = () => {
  const el = document.getElementById("task");
  if(!el.value.trim()) return;
  const t = el.value.trim(); el.value = "";
  ask(t);
};
document.getElementById("task").addEventListener("keydown", e => {
  if(e.key === "Enter") document.getElementById("send").click();
});

document.getElementById("btnDoc").onclick = () => {
  ask("读取 state/notes.json，在 docs/demo-notes.md 写一份笔记摘要文档（含条目数、完成数、关键条目）");
};

load();
setInterval(load, 2000);   // DSH 改了文件，前端自动重载
</script>
</body>
</html>
